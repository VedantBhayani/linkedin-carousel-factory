name: Render LinkedIn Carousel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run = process at most one job; preflight = read-only check of the Sheet and the next Drive file"
        type: choice
        options:
          - run
          - preflight
        default: run

concurrency:
  group: carousel-production-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Preflight (read-only)
        if: inputs.mode == 'preflight'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SPREADSHEET_ID: ${{ secrets.SHEET_SPREADSHEET_ID }}
          SHEET_NAME: Sheet1
        run: npm run preflight

      - name: Install Chromium
        if: inputs.mode != 'preflight'
        run: npx playwright install --with-deps chromium

      - name: Test and render
        if: inputs.mode != 'preflight'
        run: npm test

      - name: Run production worker
        if: inputs.mode != 'preflight'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SPREADSHEET_ID: ${{ secrets.SHEET_SPREADSHEET_ID }}
          SHEET_NAME: Sheet1
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: npm run worker
